# Slack app manifest for the support integration.
# Create the app at https://api.slack.com/apps -> Create New App -> From a manifest.
# REPLACE the request_url if the site is not served from https://berycode.cz.
display_information:
  name: BeryCode Support
  description: Customer support tickets submitted on berycode.cz
  background_color: "#18181b"
features:
  bot_user:
    display_name: BeryCode Support
    always_online: false
oauth_config:
  scopes:
    bot:
      # Post the ticket message and update it (chat.postMessage, chat.update).
      - chat:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://berycode.cz/api/support/slack-actions.php
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
